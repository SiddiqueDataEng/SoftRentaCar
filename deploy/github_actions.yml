# .github/workflows/deploy.yml
# Copy this to .github/workflows/deploy.yml in your repo

name: CI/CD — Soft Rent a Car

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION:       us-east-1
  ECR_REPO:         softrentacar
  ECS_CLUSTER:      soft-rentacar-cluster
  ECS_SERVICE:      soft-rentacar-service
  AZURE_APP:        soft-rentacar-app
  AZURE_RG:         rg-softrentacar
  AZURE_ACR:        softrentacaracr

jobs:
  # ── Test ──────────────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check all Python files
        run: |
          python -c "
          import ast, os
          errs = []
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in ['__pycache__','.git','data']]
              for f in files:
                  if not f.endswith('.py'): continue
                  p = os.path.join(root,f)
                  try: ast.parse(open(p,encoding='utf-8').read())
                  except SyntaxError as e: errs.append(f'{p}: {e}')
          if errs:
              print('\n'.join(errs)); exit(1)
          print('All files OK')
          "

      - name: Generate test data
        run: python generate_data.py

      - name: Test ML models
        run: python test_all.py

  # ── Deploy to Streamlit Cloud (auto on push) ──────────────────────────
  # Streamlit Cloud auto-deploys from GitHub — no action needed

  # ── Deploy to AWS ─────────────────────────────────────────────────────
  deploy-aws:
    name: Deploy to AWS ECS
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG:    ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG .
          docker tag    $ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG \
                        $ECR_REGISTRY/$ECR_REPO:latest
          docker push   $ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG
          docker push   $ECR_REGISTRY/$ECR_REPO:latest
          echo "image=$ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Force new ECS deployment
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --force-new-deployment \
            --output none
          echo "✅ ECS deployment triggered"

  # ── Deploy to Azure ───────────────────────────────────────────────────
  deploy-azure:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push to ACR
        run: |
          az acr build \
            --registry $AZURE_ACR \
            --image softrentacar:${{ github.sha }} \
            --image softrentacar:latest \
            --file Dockerfile \
            .

      - name: Update Container App
        run: |
          az containerapp update \
            --name $AZURE_APP \
            --resource-group $AZURE_RG \
            --image ${AZURE_ACR}.azurecr.io/softrentacar:${{ github.sha }}
          echo "✅ Azure Container App updated"
