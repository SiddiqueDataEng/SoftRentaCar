# docker-compose.yml — Local development with Docker
# Run: docker-compose up

version: "3.9"

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: soft-rentacar
    ports:
      - "8501:8501"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - CARTO_API_KEY=${CARTO_API_KEY:-}
    volumes:
      # Mount data directory so generated data persists
      - ../data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Optional: Nginx reverse proxy for production-like local setup
  nginx:
    image: nginx:alpine
    container_name: soft-rentacar-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    profiles:
      - with-nginx   # Only start with: docker-compose --profile with-nginx up
